<div class="space-y-6">
  <div class="flex flex-col gap-4 lg:flex-row lg:items-end lg:justify-between">
    <div>
      <h1 class="text-2xl font-bold text-zinc-900">Host+ Home</h1>
      <p class="mt-1 text-sm text-zinc-500">Manage the Host+ profile and contact details visible to TJS.</p>
    </div>

    <div class="flex flex-wrap gap-2">
      <a routerLink="/backoffice/host-plus/events" class="inline-flex items-center justify-center rounded-lg border border-zinc-200 bg-white px-4 py-2 text-sm font-semibold text-zinc-700 shadow-sm transition-colors hover:bg-zinc-50">
        Events
      </a>
      <a routerLink="/backoffice/host-plus/settings" class="inline-flex items-center justify-center rounded-lg bg-red-600 px-4 py-2 text-sm font-semibold text-white shadow-sm transition-colors hover:bg-red-700">
        Settings
      </a>
    </div>
  </div>

  <div *ngIf="error" class="rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700">
    {{ error }}
  </div>

  <div *ngIf="successMessage" class="rounded-xl border border-green-200 bg-green-50 px-4 py-3 text-sm text-green-700">
    {{ successMessage }}
  </div>

  <div *ngIf="isLoading" class="flex items-center justify-center rounded-2xl border border-zinc-200 bg-white py-20 shadow-sm">
    <div class="h-8 w-8 animate-spin rounded-full border-4 border-zinc-200 border-t-red-600"></div>
  </div>

  <ng-container *ngIf="!isLoading && host">
    <section class="rounded-2xl border border-zinc-200 bg-white p-5 shadow-sm">
      <div class="flex flex-col gap-2 md:flex-row md:items-center md:justify-between">
        <div>
          <p class="text-xs font-semibold uppercase tracking-wide text-red-600">Current Host+</p>
          <h2 class="mt-1 text-xl font-semibold text-zinc-900">{{ hostName }}</h2>
          <p class="mt-1 text-sm text-zinc-500">{{ host.city || 'City not set' }}<span *ngIf="host.country">, {{ host.country }}</span></p>
        </div>
        <span class="inline-flex w-fit rounded-full border border-amber-200 bg-amber-50 px-3 py-1 text-xs font-semibold text-amber-700">Host+</span>
      </div>
    </section>

    <form class="rounded-2xl border border-zinc-200 bg-white p-5 shadow-sm" (ngSubmit)="saveDetails()">
      <div class="flex items-center justify-between gap-4 border-b border-zinc-100 pb-4">
        <div>
          <h2 class="text-lg font-semibold text-zinc-900">Host+ Details</h2>
          <p class="mt-1 text-sm text-zinc-500">Edit the core information for this Host+ account.</p>
        </div>
        <app-workspace-edit-actions
          [isEditing]="isEditing"
          [isSaving]="isSaving"
          saveLabel="Save changes"
          saveType="submit"
          (edit)="startEditing()"
          (cancel)="cancelEditing()"
        />
      </div>

      <fieldset [disabled]="!isEditing || isSaving" class="mt-5 grid gap-4 md:grid-cols-2 disabled:opacity-75">
        <div>
          <label class="mb-1 block text-sm font-medium text-zinc-700">Name <span class="text-red-500">*</span></label>
          <input type="text" [(ngModel)]="form.name" name="name" class="w-full rounded-lg border border-zinc-300 px-3 py-2 text-sm focus:border-red-500 focus:outline-none focus:ring-2 focus:ring-red-500/20" />
        </div>
        <div>
          <label class="mb-1 block text-sm font-medium text-zinc-700">Public name</label>
          <input type="text" [(ngModel)]="form.public_name" name="public_name" class="w-full rounded-lg border border-zinc-300 px-3 py-2 text-sm focus:border-red-500 focus:outline-none focus:ring-2 focus:ring-red-500/20" />
        </div>
        <div>
          <label class="mb-1 block text-sm font-medium text-zinc-700">Capacity</label>
          <input type="number" [(ngModel)]="form.capacity" name="capacity" class="w-full rounded-lg border border-zinc-300 px-3 py-2 text-sm focus:border-red-500 focus:outline-none focus:ring-2 focus:ring-red-500/20" />
        </div>
        <div>
          <label class="mb-1 block text-sm font-medium text-zinc-700">Events per year</label>
          <input type="text" [(ngModel)]="form.host_per_year" name="host_per_year" class="w-full rounded-lg border border-zinc-300 px-3 py-2 text-sm focus:border-red-500 focus:outline-none focus:ring-2 focus:ring-red-500/20" />
        </div>
        <div class="md:col-span-2">
          <label class="mb-1 block text-sm font-medium text-zinc-700">Address</label>
          <input type="text" [(ngModel)]="form.address" name="address" class="w-full rounded-lg border border-zinc-300 px-3 py-2 text-sm focus:border-red-500 focus:outline-none focus:ring-2 focus:ring-red-500/20" />
        </div>
        <div>
          <label class="mb-1 block text-sm font-medium text-zinc-700">City</label>
          <input type="text" [(ngModel)]="form.city" name="city" class="w-full rounded-lg border border-zinc-300 px-3 py-2 text-sm focus:border-red-500 focus:outline-none focus:ring-2 focus:ring-red-500/20" />
        </div>
        <div>
          <label class="mb-1 block text-sm font-medium text-zinc-700">Province</label>
          <input type="text" [(ngModel)]="form.proviance" name="proviance" class="w-full rounded-lg border border-zinc-300 px-3 py-2 text-sm focus:border-red-500 focus:outline-none focus:ring-2 focus:ring-red-500/20" />
        </div>
        <div>
          <label class="mb-1 block text-sm font-medium text-zinc-700">Zip</label>
          <input type="text" [(ngModel)]="form.zip" name="zip" class="w-full rounded-lg border border-zinc-300 px-3 py-2 text-sm focus:border-red-500 focus:outline-none focus:ring-2 focus:ring-red-500/20" />
        </div>
        <div>
          <label class="mb-1 block text-sm font-medium text-zinc-700">Country</label>
          <input type="text" [(ngModel)]="form.country" name="country" class="w-full rounded-lg border border-zinc-300 px-3 py-2 text-sm focus:border-red-500 focus:outline-none focus:ring-2 focus:ring-red-500/20" />
        </div>
        <div>
          <label class="mb-1 block text-sm font-medium text-zinc-700">Contact first name</label>
          <input type="text" [(ngModel)]="form.contact_fname" name="contact_fname" class="w-full rounded-lg border border-zinc-300 px-3 py-2 text-sm focus:border-red-500 focus:outline-none focus:ring-2 focus:ring-red-500/20" />
        </div>
        <div>
          <label class="mb-1 block text-sm font-medium text-zinc-700">Contact last name</label>
          <input type="text" [(ngModel)]="form.contact_lname" name="contact_lname" class="w-full rounded-lg border border-zinc-300 px-3 py-2 text-sm focus:border-red-500 focus:outline-none focus:ring-2 focus:ring-red-500/20" />
        </div>
        <div>
          <label class="mb-1 block text-sm font-medium text-zinc-700">Phone 1</label>
          <input type="tel" [(ngModel)]="form.contact_phone1" name="contact_phone1" class="w-full rounded-lg border border-zinc-300 px-3 py-2 text-sm focus:border-red-500 focus:outline-none focus:ring-2 focus:ring-red-500/20" />
        </div>
        <div>
          <label class="mb-1 block text-sm font-medium text-zinc-700">Phone 2</label>
          <input type="tel" [(ngModel)]="form.contact_phone2" name="contact_phone2" class="w-full rounded-lg border border-zinc-300 px-3 py-2 text-sm focus:border-red-500 focus:outline-none focus:ring-2 focus:ring-red-500/20" />
        </div>
        <div>
          <label class="mb-1 block text-sm font-medium text-zinc-700">Email</label>
          <input type="email" [(ngModel)]="form.contact_email" name="contact_email" class="w-full rounded-lg border border-zinc-300 px-3 py-2 text-sm focus:border-red-500 focus:outline-none focus:ring-2 focus:ring-red-500/20" />
        </div>
        <div>
          <label class="mb-1 block text-sm font-medium text-zinc-700">Website</label>
          <input type="url" [(ngModel)]="form.web_url" name="web_url" placeholder="https://..." class="w-full rounded-lg border border-zinc-300 px-3 py-2 text-sm focus:border-red-500 focus:outline-none focus:ring-2 focus:ring-red-500/20" />
        </div>
        <div class="md:col-span-2">
          <label class="mb-1 block text-sm font-medium text-zinc-700">Comment</label>
          <textarea [(ngModel)]="form.comment" name="comment" rows="4" class="w-full rounded-lg border border-zinc-300 px-3 py-2 text-sm focus:border-red-500 focus:outline-none focus:ring-2 focus:ring-red-500/20"></textarea>
        </div>
      </fieldset>
    </form>
  </ng-container>
</div>
